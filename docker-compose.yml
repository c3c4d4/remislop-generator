version: '3'

services:
  rabbitmq:
    image: "rabbitmq:3-management"
    ports:
      - "5672:5672"
      - "15672:15672"
    hostname: rabbitmq

  worker:
    build: .
    command: celery -A celery_config worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - OUTPUT_DIRECTORY=/app/downloaded_images
      - DATABASE_PATH=/app/instance/jobs.sqlite3
    depends_on:
      - rabbitmq
    volumes:
      - shared_data:/app/downloaded_images
      - app_data:/app/instance

  web:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - rabbitmq
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - OUTPUT_DIRECTORY=/app/downloaded_images
      - DATABASE_PATH=/app/instance/jobs.sqlite3
    volumes:
      - shared_data:/app/downloaded_images
      - app_data:/app/instance

volumes:
  shared_data:
  app_data:
