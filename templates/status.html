<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job {{ job.id }}</title>
    <style>
        /* Adwaita dark is the default; light overrides at the bottom. */
        :root {
            color-scheme: dark;
            /* Adwaita dark colour tokens (libadwaita 1.10) */
            --window-bg-color: #222226;
            --window-fg-color: #ffffff;
            --view-bg-color: #1d1d20;
            --view-fg-color: #ffffff;
            --headerbar-bg-color: #2e2e32;
            --card-bg-color: rgba(255, 255, 255, 0.08);
            --card-shade-color: rgba(0, 0, 6, 0.25);
            --dialog-bg-color: #36363a;
            --popover-bg-color: #36363a;
            --sidebar-bg-color: #2e2e32;
            --thumb-bg-color: #39393d;
            --video-bg-color: #16161a;
            --border-color: rgba(255, 255, 255, 0.1);
            --shade-color: rgba(255, 255, 255, 0.12);
            --track-color: rgba(255, 255, 255, 0.15);
            --button-bg-color: rgba(255, 255, 255, 0.1);
            --button-hover-bg-color: rgba(255, 255, 255, 0.16);
            --button-active-bg-color: rgba(255, 255, 255, 0.22);
            --button-border-color: transparent;
            --control-border-color: transparent;
            --control-hover-border-color: rgba(255, 255, 255, 0.1);
            --row-hover-color: rgba(255, 255, 255, 0.04);
            --dim-color: rgba(255, 255, 255, 0.55);
            --scrollbar-thumb-color: rgba(255, 255, 255, 0.25);
            --scrollbar-thumb-hover-color: rgba(255, 255, 255, 0.4);
            --selection-bg-color: rgba(53, 132, 228, 0.45);
            --check-bg-color: rgba(0, 0, 6, 0.45);
            --check-border-color: rgba(255, 255, 255, 0.2);
            --check-hover-border-color: rgba(255, 255, 255, 0.35);
            --check-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
            --thumb-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            --trough-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
            --knob-color: #ffffff;
            --accent-bg-color: #3584e4;
            --accent-fg-color: #ffffff;
            --accent-color: #81d0ff;
            --accent-hover: #62a0ea;
            --accent-active: #1c71d8;
            --destructive-bg-color: #c01c28;
            --destructive-color: #ff938c;
            --error-bg-color: #c01c28;
            --error-color: #ff938c;
            --success-color: #78e9ab;
            --warning-color: #ffc252;
            /* Adwaita type scale */
            --font-family: "Adwaita Sans", Cantarell, system-ui, -apple-system, sans-serif;
            --font-title: 20px;
            --font-body: 15px;
            --font-label: 13px;
            --font-caption: 11px;
            /* metrics */
            --radius-control: 6px;
            --radius-card: 12px;
            --space-1: 3px;
            --space-2: 6px;
            --space-3: 9px;
            --space-4: 12px;
            --space-5: 18px;
            --space-6: 24px;
            --space-7: 36px;
            --space-8: 48px;
            --control-height: 34px;
        }

        @media (prefers-color-scheme: light) {
            /* Adwaita light colour tokens */
            :root {
                color-scheme: light;
                --window-bg-color: #fafafa;
                --window-fg-color: rgba(0, 0, 0, 0.8);
                --view-bg-color: #ffffff;
                --view-fg-color: #333333;
                --headerbar-bg-color: #ffffff;
                --card-bg-color: #ffffff;
                --card-shade-color: rgba(0, 0, 0, 0.07);
                --dialog-bg-color: #fafafa;
                --popover-bg-color: #ffffff;
                --sidebar-bg-color: #ebebed;
                --thumb-bg-color: #ffffff;
                --video-bg-color: #241f31;
                --border-color: rgba(0, 0, 0, 0.15);
                --shade-color: #e6e6e6;
                --track-color: #deddda;
                --button-bg-color: rgba(0, 0, 0, 0.08);
                --button-hover-bg-color: rgba(0, 0, 0, 0.13);
                --button-active-bg-color: rgba(0, 0, 0, 0.18);
                --button-border-color: rgba(0, 0, 0, 0.06);
                --control-border-color: rgba(0, 0, 0, 0.15);
                --control-hover-border-color: rgba(0, 0, 0, 0.25);
                --row-hover-color: rgba(0, 0, 0, 0.04);
                --dim-color: #5e5c64;
                --scrollbar-thumb-color: rgba(0, 0, 0, 0.25);
                --scrollbar-thumb-hover-color: rgba(0, 0, 0, 0.38);
                --selection-bg-color: rgba(53, 132, 228, 0.3);
                --check-bg-color: #ffffff;
                --check-border-color: rgba(0, 0, 0, 0.15);
                --check-hover-border-color: rgba(0, 0, 0, 0.25);
                --check-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
                --thumb-shadow: 0 1px 3px rgba(0, 0, 0, 0.18);
                --trough-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.06);
                --knob-color: #ffffff;
                --accent-bg-color: #3584e4;
                --accent-fg-color: #ffffff;
                --accent-color: #1c71d8;
                --accent-hover: #62a0ea;
                --accent-active: #1c71d8;
                --destructive-bg-color: #e01b24;
                --destructive-color: #c01c28;
                --error-bg-color: #e01b24;
                --error-color: #c01c28;
                --success-color: #26a269;
                --warning-color: #cd9309;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--font-family);
            font-size: var(--font-body);
            line-height: 1.5;
            color: var(--window-fg-color);
            background-color: var(--window-bg-color);
        }
        h1 {
            margin: 0 0 var(--space-2);
            font-size: var(--font-title);
            font-weight: 800;
            line-height: 1.3;
        }
        h2 { margin: 0; font-size: var(--font-body); font-weight: 700; }
        a { color: var(--accent-color); }
        .meta {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            color: var(--dim-color);
            font-size: var(--font-label);
            font-variant-numeric: tabular-nums;
            overflow-wrap: anywhere;
        }
        /* --- controls ---------------------------------------------------- */
        button, .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: var(--control-height);
            padding: var(--space-2) var(--space-5);
            border: 1px solid var(--button-border-color);
            border-radius: var(--radius-control);
            background-color: var(--button-bg-color);
            color: var(--window-fg-color);
            font: inherit;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        button:hover, .button:hover { background-color: var(--button-hover-bg-color); }
        button:active, .button:active { background-color: var(--button-active-bg-color); }
        button[type="submit"] {
            border-color: transparent;
            background-color: var(--accent-bg-color);
            color: var(--accent-fg-color);
        }
        button[type="submit"]:hover { background-color: var(--accent-hover); }
        button[type="submit"]:active { background-color: var(--accent-active); }
        button:focus-visible, .button:focus-visible {
            outline: 2px solid var(--accent-bg-color);
            outline-offset: 2px;
        }
        input, textarea, select {
            width: 100%;
            min-height: var(--control-height);
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--control-border-color);
            border-radius: var(--radius-control);
            background-color: var(--view-bg-color);
            color: var(--window-fg-color);
            font: inherit;
        }
        textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
        input::placeholder, textarea::placeholder { color: var(--dim-color); }
        input:hover, textarea:hover { border-color: var(--control-hover-border-color); }
        input:focus, textarea:focus {
            outline: 2px solid var(--accent-bg-color);
            outline-offset: 1px;
            border-color: transparent;
        }
        input[type="file"] {
            padding: var(--space-1) var(--space-2);
            color: var(--dim-color);
        }
        input[type="file"]::file-selector-button {
            margin: 0 var(--space-3) 0 0;
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--button-border-color);
            border-radius: var(--radius-control);
            background-color: var(--shade-color);
            color: var(--window-fg-color);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        input[type="checkbox"], input[type="range"] {
            width: auto;
            min-height: 0;
            padding: 0;
            border: 0;
            background-color: transparent;
            accent-color: var(--accent-bg-color);
        }
        ::selection {
            background-color: var(--selection-bg-color);
            color: var(--window-fg-color);
        }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background-color: transparent; }
        ::-webkit-scrollbar-thumb {
            border: 3px solid transparent;
            border-radius: 999px;
            background-color: var(--scrollbar-thumb-color);
            background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-thumb-hover-color);
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::after, *::before { transition-duration: 0s; animation-duration: 0s; }
        }
        main { width: min(672px, calc(100vw - 32px)); margin: var(--space-8) auto; }
        .bar {
            height: 9px;
            margin: var(--space-5) 0;
            border-radius: 999px;
            background-color: var(--track-color);
            box-shadow: var(--trough-shadow);
            overflow: hidden;
        }
        .fill {
            height: 100%;
            width: {{ job.progress }}%;
            background-color: var(--accent-bg-color);
            transition: width 180ms ease;
        }
        ol {
            list-style: none;
            margin: 0;
            padding: var(--space-3) var(--space-5);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            background-color: var(--card-bg-color);
            display: grid;
            gap: var(--space-1);
        }
        li {
            display: grid;
            grid-template-columns: 21px 1fr;
            gap: var(--space-2);
            align-items: center;
            padding: var(--space-1) 0;
            color: var(--dim-color);
        }
        .dot {
            width: 12px;
            height: 12px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background-color: var(--view-bg-color);
            justify-self: center;
        }
        .done, .active { color: var(--window-fg-color); }
        .active { color: var(--accent-color); font-weight: 700; }
        .done .dot, .active .dot {
            border-color: transparent;
            background-color: var(--accent-bg-color);
        }
        .actions {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-6);
            flex-wrap: wrap;
        }
        .error {
            margin-top: var(--space-5);
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--destructive-bg-color);
            border-radius: var(--radius-control);
            background-color: var(--view-bg-color);
            color: var(--destructive-color);
            font-size: var(--font-label);
            white-space: pre-wrap;
        }
        .preview { margin-top: var(--space-5); }
        video {
            display: block;
            width: 100%;
            max-height: 70vh;
            border-radius: var(--radius-control);
            background-color: var(--video-bg-color);
        }

    </style>
</head>
<body>
<main>
    <h1 id="title">{{ job.name }}</h1>
    <div class="meta" id="meta">{{ job.status }} · {{ job.progress }}%</div>
    <div class="meta">{{ job.board_url }}</div>

    <div class="bar"><div class="fill" id="fill"></div></div>

    <ol id="steps">
        {% for step in steps %}
            <li class="{{ step.state }}" data-step="{{ step.id }}"><span class="dot"></span><span>{{ step.label }}</span></li>
        {% endfor %}
    </ol>

    <div id="error" class="error" {% if not job.error %}hidden{% endif %}>{{ job.error }}</div>

    <div id="preview" class="preview" {% if not job.video_url %}hidden{% endif %}>
        <video id="video" controls preload="metadata" src="{{ job.video_url or '' }}"></video>
    </div>

    <div class="actions">
        <button class="button" id="open" type="button" data-open-url="{{ job.open_url or '' }}" {% if not job.open_url %}hidden{% endif %}>Open in Explorer</button>
        <button class="button secondary" id="save" type="button" data-save-url="{{ job.save_url or '' }}" {% if not job.save_url or job.saved %}hidden{% endif %}>Keep video</button>
        <a class="button secondary" id="download" href="{{ job.download_url or '#' }}" {% if not job.download_url %}hidden{% endif %}>Download</a>
        <a class="button secondary" href="{{ url_for('index') }}">New job</a>
    </div>
</main>

<script>
const jobId = "{{ job.id }}";
async function refresh() {
    const response = await fetch(`/api/jobs/${jobId}`);
    if (!response.ok) return;
    const job = await response.json();
    document.getElementById("meta").textContent = `${job.status} · ${job.progress}%`;
    document.getElementById("fill").style.width = `${job.progress}%`;
    for (const step of job.steps) {
        const el = document.querySelector(`[data-step="${step.id}"]`);
        if (el) el.className = step.state;
    }
    const error = document.getElementById("error");
    error.hidden = !job.error;
    error.textContent = job.error || "";
    const download = document.getElementById("download");
    download.hidden = !job.download_url;
    if (job.download_url) download.href = job.download_url;
    const preview = document.getElementById("preview");
    const video = document.getElementById("video");
    preview.hidden = !job.video_url;
    if (job.video_url && video.getAttribute("src") !== job.video_url) video.setAttribute("src", job.video_url);
    const open = document.getElementById("open");
    open.hidden = !job.open_url;
    if (job.open_url) open.dataset.openUrl = job.open_url;
    const save = document.getElementById("save");
    save.hidden = !job.save_url || Boolean(job.saved);
    if (job.save_url) save.dataset.saveUrl = job.save_url;
    if (!["complete", "failed"].includes(job.status)) setTimeout(refresh, 1500);
}
document.getElementById("open").addEventListener("click", async (event) => {
    const url = event.currentTarget.dataset.openUrl;
    if (!url) return;
    await fetch(url, { method: "POST" });
});
document.getElementById("save").addEventListener("click", async (event) => {
    const url = event.currentTarget.dataset.saveUrl;
    if (!url) return;
    const response = await fetch(url, { method: "POST" });
    if (response.ok) event.currentTarget.hidden = true;
});
if (!["complete", "failed"].includes("{{ job.status }}")) setTimeout(refresh, 1000);
</script>
</body>
</html>
